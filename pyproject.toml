[project]
name = "cdse-stac-client"
version = "0.1.0"
description = "Search the Copernicus Data Space STAC catalogue for Sentinel-2 scenes over a parcel and stage them in PostGIS"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "db: needs the PostGIS test database (TEST_DATABASE_URL); skipped when it is not reachable",
]
